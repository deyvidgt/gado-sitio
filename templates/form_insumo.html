{% extends "base.html" %}
{% block title %}{% if ins %}Editar Insumo{% else %}Novo Insumo{% endif %}{% endblock %}
{% block page_title %}{% if ins %}Editar Insumo / Produto{% else %}Novo Insumo / Produto{% endif %}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    
    <div class="form-group" style="margin-bottom: 16px;">
      <label>Nome do Produto</label>
      <input type="text" name="nome" value="{{ ins.nome if ins else '' }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border)">
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label>Categoria</label>
      <select name="categoria" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text)">
        {% for cat in CATEGORIAS %}
        <option value="{{ cat }}" {% if ins and ins.categoria == cat %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label>Peso do Saco (kg)</label>
      <input type="number" step="any" name="peso_saco" value="{{ ins.peso_saco if ins else 25.0 }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border)">
    </div>

    <div class="form-group" style="margin-bottom: 24px;">
      <label>Quantidade Avulsa em Estoque (kg)</label>
      <input type="number" step="any" name="quantidade" value="{{ ins.quantidade if ins else 0.0 }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border)">
    </div>

    <div style="display: flex; gap: 12px; justify-content: flex-end;">
      <a href="{{ url_for('estoque_insumos') }}" class="btn btn-outline">Cancelar</a>
      <button type="submit" class="btn btn-primary">Salvar Alterações</button>
    </div>
  </form>
</div>
{% endblock %}
